<style>
  :root{
    --bg:#eef1f6;
    --surface:#ffffff;
    --surface-alt:#f4f6fa;
    --border:#e2e6f0;
    --ink:#16234a;
    --ink-soft:#20305f;
    --text:#1a2036;
    --muted:#6b7280;
    --accent:#f47c20;
    --accent-dark:#d9660f;
    --accent-soft:#fdecdc;
    --indigo:#2f5fa8;
    --indigo-soft:#e5edf8;
    --amber:#2f5fa8;
    --amber-soft:#e5edf8;
    --red:#d64545;
    --red-soft:#fbe7e6;
    --shadow-sm: 0 1px 2px rgba(22,35,74,0.07);
    --shadow-md: 0 4px 14px rgba(22,35,74,0.10);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px;
    background:var(--ink);
    color:#c7cbe6;
    display:flex;
    flex-direction:column;
    padding:24px 0 18px 0;
    flex-shrink:0;
  }
  .brand{
    padding:2px 22px 20px 22px;
    margin-bottom:10px;
  }
  .brand-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:5px;
    font-weight:600;
  }
  .brand h1{
    font-family:'Sora',sans-serif;
    font-size:20px;
    font-weight:700;
    line-height:1.2;
    margin:0;
    color:#ffffff;
    letter-spacing:-.01em;
  }
  .brand-theme{
    margin-top:11px;
    overflow:hidden;
    white-space:nowrap;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .brand-theme-track{
    display:inline-block;
    padding-left:100%;
    font-family:'Sora',sans-serif;
    font-size:12px;font-weight:700;font-style:italic;
    color:#ff9d4d;
    letter-spacing:.01em;
    animation: theme-marquee 16s linear infinite;
  }
  @keyframes theme-marquee{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce){
    .brand-theme-track{ animation:none; padding-left:0; }
    .brand-theme{ white-space:normal; -webkit-mask-image:none; mask-image:none; }
  }
  .nav-tabs{display:flex;flex-direction:column;gap:2px;padding:0 12px;}
  .nav-tab{
    display:flex;align-items:center;gap:11px;
    text-align:left;
    background:none;border:none;
    color:#9aa0c6;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:11px 14px;
    border-radius:9px;
    cursor:pointer;
    position:relative;
    transition:background .15s ease, color .15s ease;
    width:100%;
  }
  .nav-tab svg{flex-shrink:0;opacity:.85;}
  .nav-tab:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-tab.active{background:var(--accent);color:#fff;font-weight:600;}
  .nav-tab.active svg{opacity:1;}
  .sidebar-footer{
    margin-top:auto;
    padding:16px 22px 0 22px;
    border-top:1px solid rgba(255,255,255,0.1);
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:#6b7099;
    line-height:1.7;
  }

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 34px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    gap:16px;flex-wrap:wrap;
  }
  .topbar h2{
    font-family:'Sora',sans-serif;
    font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;
  }
  .topbar .sub{font-size:13px;color:var(--muted);margin-top:3px;}
  .actions{display:flex;align-items:center;gap:12px;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13.5px;font-weight:600;
    padding:10px 17px;
    border-radius:9px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--accent);color:#fff;}
  .btn-gold:hover{background:var(--accent-dark);box-shadow:var(--shadow-md);}
  .btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:var(--shadow-sm);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn-ghost{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px;}
  .btn-danger-text{color:var(--red);}
  .save-indicator{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--accent);
    opacity:0;transition:opacity .4s ease;
    display:flex;align-items:center;gap:5px;
  }
  .save-indicator.show{opacity:1;}

  .content{padding:28px 34px 60px 34px;overflow-y:auto;}

  /* ---------- Cards / Dashboard ---------- */
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:19px 21px;
    box-shadow:var(--shadow-sm);
  }
  .card .label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px;font-weight:500;
  }
  .card .value{
    font-family:'Sora',sans-serif;font-size:26px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .card.green .value{color:var(--accent-dark);}
  .card.red .value{color:var(--red);}
  .card.gold{background:var(--ink);border-color:var(--ink);}
  .card.gold .label{color:#9aa0c6;}
  .card.gold .value{color:#fff;}

  /* ---------- Hero (vue financière) ---------- */
  .hero-block{
    background:var(--ink);
    border-radius:16px;
    padding:32px 36px;
    margin-bottom:24px;
    box-shadow:var(--shadow-md);
    color:#fff;
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:22px;}
  .hero-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:#9aa0c6;margin-bottom:10px;font-weight:600;
  }
  .hero-figure{
    font-family:'Sora',sans-serif;font-weight:800;font-size:44px;
    font-variant-numeric:tabular-nums;color:#fff;letter-spacing:-.02em;line-height:1;
  }
  .hero-formula{font-size:12.5px;color:#9aa0c6;font-family:'JetBrains Mono',monospace;text-align:right;}
  .hero-formula b{color:#fff;font-weight:600;}
  .hero-bar-track{
    display:flex;width:100%;height:14px;border-radius:8px;overflow:hidden;
    background:rgba(255,255,255,0.08);margin-bottom:12px;
  }
  .hero-bar-seg{height:100%;transition:width .3s ease;}
  .hero-legend{display:flex;gap:22px;flex-wrap:wrap;}
  .hero-legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#c7cbe6;}
  .hero-legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}

  .section-title{
    font-family:'Sora',sans-serif;font-size:16px;font-weight:700;
    margin:6px 0 14px 0;display:flex;align-items:center;gap:10px;color:var(--text);
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--border);}

  .breakdown{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:8px;}
  @media (max-width:880px){.breakdown{grid-template-columns:1fr;}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px 21px;box-shadow:var(--shadow-sm);}
  .bar-row{margin-bottom:12px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-row .bar-label b{font-family:'JetBrains Mono',monospace;font-weight:600;}
  .bar-track{background:var(--surface-alt);height:8px;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .bar-fill.gold{background:var(--amber);}

  /* ---------- Forms ---------- */
  .form-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow-sm);
  }
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:end;}
  .field label{
    display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:500;
  }
  .field input, .field select{
    width:100%;padding:10px 11px;border:1px solid var(--border);
    border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;
    background:var(--surface-alt);color:var(--text);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft);}
  .form-actions{display:flex;gap:10px;margin-top:6px;}

  /* ---------- Toolbar (filters) ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input[type=text]{
    padding:10px 13px;border:1px solid var(--border);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:13.5px;min-width:220px;background:var(--surface);
  }
  .toolbar select{padding:10px 13px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--surface);}
  .toolbar input:focus, .toolbar select:focus{outline:none;border-color:var(--accent);}
  .toolbar .count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}

  /* ---------- Table ---------- */
  .table-wrap{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:var(--surface-alt);color:var(--muted);
    text-align:left;padding:12px 16px;font-weight:600;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.04em;text-transform:uppercase;
    border-bottom:1px solid var(--border);
  }
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--surface-alt);}
  tbody td{padding:11px 16px;vertical-align:middle;}
  td.num, th.num{text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  tfoot td{
    padding:13px 16px;font-weight:700;
    border-top:2px solid var(--ink);
    background:var(--surface-alt);
    font-family:'JetBrains Mono',monospace;
  }
  .cat-pill{
    display:inline-block;padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-dark);
  }
  .status-pill{
    display:inline-block;padding:4px 11px;border-radius:20px;
    font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .status-paye{background:var(--accent-soft);color:var(--accent-dark);}
  .status-partiel{background:var(--red-soft);color:var(--red);}
  .status-excedent{background:var(--amber-soft);color:var(--amber);}
  .row-actions{display:flex;gap:10px;}
  .row-actions button{
    background:none;border:none;cursor:pointer;font-size:12.5px;
    font-family:'Inter',sans-serif;font-weight:600;color:var(--muted);
  }
  .row-actions button:hover{color:var(--ink);}
  .row-actions button.danger:hover{color:var(--red);}
  .empty-row td{text-align:center;color:var(--muted);padding:34px;font-style:italic;}

  /* ---------- Settings ---------- */
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:880px){.settings-grid{grid-template-columns:1fr;}}
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .cat-row input[type=number]{width:120px;}
  .cat-row .cat-name{flex:1;font-weight:600;}
  .tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .tag{
    background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;
    padding:6px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;
  }
  .tag button{background:none;border:none;color:var(--red);cursor:pointer;font-weight:700;}

  /* mobile sidebar */
  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;padding:16px;flex-direction:column;}
    .nav-tabs{flex-direction:row;overflow-x:auto;padding:0;}
    .sidebar-footer{display:none;}
    .brand{padding:0 0 12px 0;}
    .content{padding:18px;}
    .topbar{padding:16px 18px;}
    .hero-block{padding:24px 22px;}
    .hero-figure{font-size:32px;}
  }

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(17,21,46,.35);
    opacity:0;transform:translateY(8px);transition:all .25s ease;pointer-events:none;z-index:999;
    font-family:'Inter',sans-serif;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-eyebrow">Camp JCF 2026</div>
      <h1>Trésor<br>JCF</h1>
      <div class="brand-theme" id="themeTag"></div>
    </div>
    <nav class="nav-tabs" id="navTabs"></nav>
    <div class="sidebar-footer">
      Données conservées uniquement<br>dans ce navigateur.<br>Aucune base de données externe.
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Tableau de bord</h2>
        <div class="sub" id="pageSub">Vue d'ensemble des finances du camp</div>
      </div>
      <div class="actions">
        <span class="save-indicator" id="saveIndicator">● enregistré</span>
        <button class="btn btn-outline" id="btnExport">⭳ Exporter le rapport Excel</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ÉTAT (aucune base de données — stockage clé/valeur perso)
   ========================================================= */
const STORAGE_KEY = 'jcf-finances-v1';

const defaultState = () => ({
  devise: 'FCFA',
  theme: "Découvrir la personne et l'œuvre du Saint-Esprit",
  categoriesParticipation: [
    { id:'travailleur', nom:'Travailleur',                    montant: 15000 },
    { id:'pasteur',     nom:'Pasteur',                        montant: 10000 },
    { id:'etudiant',    nom:'Étudiant',                       montant: 10000 },
    { id:'eleve',       nom:'Élève',                          montant: 4000 },
    { id:'longue_dist', nom:'Participant (+100 km)',          montant: 3000 },
    { id:'autre',       nom:'Autres',                         montant: 6000 },
  ],
  categoriesDepenses: [
    'Alimentation & Restauration','Transport','Hébergement / Logement',
    'Location de salle & Matériel','Communication & Publicité',
    'Santé & Secours','Décoration & Logistique','Divers / Imprévus'
  ],
  participations: [],
  dons: [],
  depenses: [],
});

let state = defaultState();
let currentTab = 'dashboard';
let editing = { participation:null, don:null, depense:null };
let filters = { participation:{q:'',cat:'',statut:''}, don:{q:''}, depense:{cat:''} };

/* ---------- persistance (localStorage du navigateur — fonctionne hors-ligne) ---------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(defaultState(), parsed);
    }
  }catch(e){ /* pas de données existantes -> on garde les valeurs par défaut */ }
  renderAll();
}
let saveTimeout=null;
function saveState(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      flashSaved();
    }catch(e){ console.error('Erreur de sauvegarde', e); }
  }, 250);
}
function flashSaved(){
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1400);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- utilitaires ---------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){
  const v = Number(n)||0;
  return v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}) + ' ' + state.devise;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function catName(id){ const c = state.categoriesParticipation.find(c=>c.id===id); return c? c.nom : id; }
function catFee(id){ const c = state.categoriesParticipation.find(c=>c.id===id); return c? Number(c.montant)||0 : 0; }
function statutPaiement(p){
  const fee = catFee(p.categorieId);
  const ecart = Number(p.montant||0) - fee;
  if(Math.abs(ecart) < 0.005) return { key:'paye', label:'Payé', cls:'status-paye', reste:0 };
  if(ecart < 0) return { key:'partiel', label:`Partiel · reste ${fmt(-ecart)}`, cls:'status-partiel', reste:-ecart };
  return { key:'excedent', label:`Excédent · +${fmt(ecart)}`, cls:'status-excedent', reste:0 };
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   NAVIGATION
   ========================================================= */
const ICONS = {
  dashboard:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>',
  participation:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M14.5 6A6 6 0 1 1 6 14.5"/><path d="M9 6.5v5M6.7 8h4.6"/></svg>',
  dons:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="4" rx="1"/><rect x="5" y="13" width="14" height="8" rx="1"/><path d="M12 9v12M12 9c-1.5-3-6-3-6 0c0 1.3 1 2 2 2M12 9c1.5-3 6-3 6 0c0 1.3-1 2-2 2"/></svg>',
  depenses:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  parametres:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 17.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>',
};
const TABS = [
  { id:'dashboard',     label:'Tableau de bord' },
  { id:'participation', label:'Frais de participation' },
  { id:'dons',          label:'Dons' },
  { id:'depenses',      label:'Dépenses' },
  { id:'parametres',    label:'Paramètres' },
];
const TITLES = {
  dashboard:['Tableau de bord',"Vue d'ensemble des finances du camp"],
  participation:['Frais de participation','Enregistrement des montants envoyés par catégorie'],
  dons:['Dons','Enregistrement des dons reçus'],
  depenses:['Dépenses','Suivi des dépenses du camp'],
  parametres:['Paramètres','Catégories, montants de référence et devise'],
};

function renderNav(){
  const nav = document.getElementById('navTabs');
  nav.innerHTML = TABS.map(t=>`
    <button class="nav-tab ${t.id===currentTab?'active':''}" data-tab="${t.id}">
      ${ICONS[t.id]}${t.label}
    </button>`).join('');
  nav.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; renderAll(); });
  });
}


function renderTopbarTheme(){
  const el = document.getElementById('themeTag');
  if(!el) return;
  if(!state.theme){ el.innerHTML=''; return; }
  el.innerHTML = `<span class="brand-theme-track">« ${escapeHtml(state.theme)} »</span>`;
}

function renderAll(){
  renderNav();
  renderTopbarTheme();
  document.getElementById('pageTitle').textContent = TITLES[currentTab][0];
  document.getElementById('pageSub').textContent = TITLES[currentTab][1];
  const c = document.getElementById('content');
  if(currentTab==='dashboard') c.innerHTML = viewDashboard();
  if(currentTab==='participation') c.innerHTML = viewParticipation();
  if(currentTab==='dons') c.innerHTML = viewDons();
  if(currentTab==='depenses') c.innerHTML = viewDepenses();
  if(currentTab==='parametres') c.innerHTML = viewParametres();
  attachHandlers();
}

/* =========================================================
   CALCULS
   ========================================================= */
function totalParticipation(){ return state.participations.reduce((s,p)=>s+Number(p.montant||0),0); }
function totalDons(){ return state.dons.reduce((s,d)=>s+Number(d.montant||0),0); }
function totalDepenses(){ return state.depenses.reduce((s,d)=>s+Number(d.montant||0),0); }
function grandTotal(){ return totalParticipation()+totalDons()-totalDepenses(); }

function participationParCategorie(){
  return state.categoriesParticipation.map(cat=>{
    const entries = state.participations.filter(p=>p.categorieId===cat.id);
    const total = entries.reduce((s,p)=>s+Number(p.montant||0),0);
    const attendu = entries.length * Number(cat.montant||0);
    return { cat, count:entries.length, total, attendu, ecart: total-attendu };
  });
}
function depensesParCategorie(){
  return state.categoriesDepenses.map(cat=>{
    const entries = state.depenses.filter(d=>d.categorie===cat);
    const total = entries.reduce((s,d)=>s+Number(d.montant||0),0);
    return { cat, count:entries.length, total };
  });
}

/* =========================================================
   VUE : DASHBOARD
   ========================================================= */
function viewDashboard(){
  const tp = totalParticipation(), td = totalDons(), tdep = totalDepenses(), gt = grandTotal();
  const parCat = participationParCategorie();
  const depCat = depensesParCategorie().filter(d=>d.total>0);
  const maxCat = Math.max(1, ...parCat.map(c=>c.total));
  const maxDep = Math.max(1, ...depCat.map(c=>c.total));
  const partiels = state.participations.map(statutPaiement).filter(s=>s.key==='partiel');
  const totalReste = partiels.reduce((s,p)=>s+p.reste,0);

  const recettes = tp + td;
  const pctP = recettes>0 ? (tp/recettes*100) : 50;
  const pctD = recettes>0 ? (td/recettes*100) : 50;

  return `
    <div class="hero-block">
      <div class="hero-top">
        <div>
          <div class="hero-label">Solde net du camp</div>
          <div class="hero-figure">${fmt(gt)}</div>
        </div>
        <div class="hero-formula">
          <b>${fmt(tp)}</b> participation + <b>${fmt(td)}</b> dons − <b>${fmt(tdep)}</b> dépenses
        </div>
      </div>
      <div class="hero-bar-track">
        <div class="hero-bar-seg" style="width:${pctP.toFixed(1)}%;background:var(--accent);"></div>
        <div class="hero-bar-seg" style="width:${pctD.toFixed(1)}%;background:var(--indigo);"></div>
      </div>
      <div class="hero-legend">
        <div class="hero-legend-item"><span class="hero-legend-dot" style="background:var(--accent);"></span>Participation — ${fmt(tp)}</div>
        <div class="hero-legend-item"><span class="hero-legend-dot" style="background:var(--indigo);"></span>Dons — ${fmt(td)}</div>
        <div class="hero-legend-item"><span class="hero-legend-dot" style="background:var(--red);"></span>Dépenses — ${fmt(tdep)}</div>
      </div>
    </div>

    <div class="cards-row">
      <div class="card green">
        <div class="label">Frais de participation</div>
        <div class="value">${fmt(tp)}</div>
      </div>
      <div class="card green">
        <div class="label">Total des dons</div>
        <div class="value">${fmt(td)}</div>
      </div>
      <div class="card red">
        <div class="label">Total des dépenses</div>
        <div class="value">${fmt(tdep)}</div>
      </div>
      <div class="card gold">
        <div class="label">Solde disponible</div>
        <div class="value">${fmt(gt)}</div>
      </div>
    </div>

    <div class="breakdown">
      <div class="panel">
        <div class="section-title">Participation par catégorie</div>
        ${parCat.map(c=>`
          <div class="bar-row">
            <div class="bar-label"><span>${escapeHtml(c.cat.nom)} <span style="color:var(--muted)">(${c.count})</span></span><b>${fmt(c.total)}</b></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(c.total/maxCat*100).toFixed(1)}%"></div></div>
          </div>`).join('') || '<p style="color:var(--muted);font-size:13px;">Aucune donnée pour le moment.</p>'}
        ${partiels.length? `<div style="margin-top:14px;padding:10px 12px;background:var(--red-soft);border-radius:6px;font-size:12.5px;color:var(--red);">
          ⚠ ${partiels.length} paiement(s) partiel(s) — reste à percevoir : <b>${fmt(totalReste)}</b>
        </div>` : ''}
      </div>
      <div class="panel">
        <div class="section-title">Dépenses par catégorie</div>
        ${depCat.length ? depCat.map(c=>`
          <div class="bar-row">
            <div class="bar-label"><span>${escapeHtml(c.cat)} <span style="color:var(--muted)">(${c.count})</span></span><b>${fmt(c.total)}</b></div>
            <div class="bar-track"><div class="bar-fill gold" style="width:${(c.total/maxDep*100).toFixed(1)}%"></div></div>
          </div>`).join('') : '<p style="color:var(--muted);font-size:13px;">Aucune dépense enregistrée.</p>'}
      </div>
    </div>
  `;
}

/* =========================================================
   VUE : PARTICIPATION
   ========================================================= */
function filteredParticipations(){
  const {q,cat,statut} = filters.participation;
  return state.participations.filter(p=>{
    const matchQ = !q || (p.nom+' '+p.prenom).toLowerCase().includes(q.toLowerCase());
    const matchCat = !cat || p.categorieId===cat;
    const matchStatut = !statut || statutPaiement(p).key===statut;
    return matchQ && matchCat && matchStatut;
  }).sort((a,b)=> b.date.localeCompare(a.date));
}

function viewParticipation(){
  const edit = editing.participation ? state.participations.find(p=>p.id===editing.participation) : null;
  const list = filteredParticipations();
  const total = list.reduce((s,p)=>s+Number(p.montant||0),0);

  return `
    <div class="form-card">
      <div class="section-title">${edit? "Modifier l'entrée" : "Ajouter une participation"}</div>
      <form id="formParticipation">
        <div class="form-grid">
          <div class="field"><label>Date</label><input type="date" name="date" required value="${edit? edit.date : todayISO()}"></div>
          <div class="field"><label>Nom</label><input type="text" name="nom" required placeholder="Kabongo" value="${edit? escapeHtml(edit.nom):''}"></div>
          <div class="field"><label>Prénom</label><input type="text" name="prenom" required placeholder="Marie" value="${edit? escapeHtml(edit.prenom):''}"></div>
          <div class="field">
            <label>Catégorie</label>
            <select name="categorieId" required>
              ${state.categoriesParticipation.map(c=>`<option value="${c.id}" ${edit&&edit.categorieId===c.id?'selected':''}>${escapeHtml(c.nom)} — ${fmt(c.montant)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Montant reçu (FCFA)</label><input type="number" step="500" min="0" name="montant" required placeholder="0" value="${edit? edit.montant:''}"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-gold">${edit?'Mettre à jour':'+ Ajouter'}</button>
          ${edit?`<button type="button" class="btn btn-outline" id="cancelEditParticipation">Annuler</button>`:''}
        </div>
      </form>
    </div>

    <div class="toolbar">
      <input type="text" id="searchParticipation" placeholder="Rechercher un nom…" value="${escapeHtml(filters.participation.q)}">
      <select id="filterCatParticipation">

/* =========================================================
   HANDLERS
   ========================================================= */
function attachHandlers(){
  // Participation
  const fp = document.getElementById('formParticipation');
  if(fp){
    fp.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(fp);
      const entry = {
        id: editing.participation || uid(),
        date: fd.get('date'), nom: fd.get('nom').trim(), prenom: fd.get('prenom').trim(),
        categorieId: fd.get('categorieId'), montant: parseFloat(fd.get('montant'))||0,
      };
      if(editing.participation){
        const idx = state.participations.findIndex(p=>p.id===editing.participation);
        state.participations[idx] = entry;
        toast('Participation mise à jour');
      }else{
        state.participations.push(entry);
        toast('Participation ajoutée');
      }
      editing.participation = null;
      saveState(); renderAll();
    });
    const cancelBtn = document.getElementById('cancelEditParticipation');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editing.participation=null; renderAll(); });
  }
  document.getElementById('searchParticipation')?.addEventListener('input', e=>{ filters.participation.q = e.target.value; renderAll(); });
  document.getElementById('filterCatParticipation')?.addEventListener('change', e=>{ filters.participation.cat = e.target.value; renderAll(); });
  document.getElementById('filterStatutParticipation')?.addEventListener('change', e=>{ filters.participation.statut = e.target.value; renderAll(); });

  // Dons
  const fd_ = document.getElementById('formDon');
  if(fd_){
    fd_.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(fd_);
      const entry = { id: editing.don||uid(), date: fd.get('date'), nom: fd.get('nom').trim(), prenom: fd.get('prenom').trim(), montant: parseFloat(fd.get('montant'))||0 };
      if(editing.don){
        const idx = state.dons.findIndex(d=>d.id===editing.don);
        state.dons[idx] = entry; toast('Don mis à jour');
      }else{ state.dons.push(entry); toast('Don ajouté'); }
      editing.don = null; saveState(); renderAll();
    });
    const cancelBtn = document.getElementById('cancelEditDon');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editing.don=null; renderAll(); });
  }
  document.getElementById('searchDon')?.addEventListener('input', e=>{ filters.don.q = e.target.value; renderAll(); });

  // Dépenses
  const fdep = document.getElementById('formDepense');
  if(fdep){
    fdep.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(fdep);
      const entry = { id: editing.depense||uid(), date: fd.get('date'), categorie: fd.get('categorie'), description: fd.get('description').trim(), montant: parseFloat(fd.get('montant'))||0 };
      if(editing.depense){
        const idx = state.depenses.findIndex(d=>d.id===editing.depense);
        state.depenses[idx] = entry; toast('Dépense mise à jour');
      }else{ state.depenses.push(entry); toast('Dépense ajoutée'); }
      editing.depense = null; saveState(); renderAll();
    });
    const cancelBtn = document.getElementById('cancelEditDepense');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editing.depense=null; renderAll(); });
  }
  document.getElementById('filterCatDepense')?.addEventListener('change', e=>{ filters.depense.cat = e.target.value; renderAll(); });

  // Edit / delete row buttons (works across tabs)
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.edit;
      if(currentTab==='participation') editing.participation = id;
      if(currentTab==='dons') editing.don = id;
      if(currentTab==='depenses') editing.depense = id;
      renderAll();
      document.querySelector('.form-card')?.scrollIntoView({behavior:'smooth'});
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.del;
      if(btn.dataset.confirming){
        if(currentTab==='participation') state.participations = state.participations.filter(p=>p.id!==id);
        if(currentTab==='dons') state.dons = state.dons.filter(d=>d.id!==id);
        if(currentTab==='depenses') state.depenses = state.depenses.filter(d=>d.id!==id);
        toast('Entrée supprimée'); saveState(); renderAll();
      }else{
        btn.dataset.confirming = '1';
        btn.textContent = 'Confirmer ?';
        setTimeout(()=>{ if(btn){ btn.dataset.confirming=''; btn.textContent='Supprimer'; } }, 2500);
      }
    });
  });

  // Paramètres
  document.getElementById('deviseInput')?.addEventListener('input', e=>{ state.devise = e.target.value || '$'; saveState(); });
  document.getElementById('themeInput')?.addEventListener('input', e=>{ state.theme = e.target.value; saveState(); renderTopbarTheme(); });
  document.querySelectorAll('[data-fee]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const cat = state.categoriesParticipation.find(c=>c.id===inp.dataset.fee);
      if(cat){ cat.montant = parseFloat(inp.value)||0; saveState(); }
    });
  });
  document.getElementById('addDepCat')?.addEventListener('click', ()=>{
    const inp = document.getElementById('newDepCat');
    const val = inp.value.trim();
    if(val && !state.categoriesDepenses.includes(val)){
      state.categoriesDepenses.push(val); saveState(); renderAll();
    }
  });
  document.querySelectorAll('[data-remove-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.removeCat;
      state.categoriesDepenses = state.categoriesDepenses.filter(c=>c!==cat);
      saveState(); renderAll();
    });
  });
  const resetBtn = document.getElementById('resetAll');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(resetBtn.dataset.confirming){
        const devise = state.devise, cp = state.categoriesParticipation, cd = state.categoriesDepenses;
        state = defaultState();
        state.devise = devise; state.categoriesParticipation = cp; state.categoriesDepenses = cd;
        toast('Toutes les données ont été réinitialisées');
        saveState(); renderAll();
      }else{
        resetBtn.dataset.confirming='1';
        document.getElementById('resetConfirmMsg').style.display='inline';
        setTimeout(()=>{ if(resetBtn){ resetBtn.dataset.confirming=''; const m=document.getElementById('resetConfirmMsg'); if(m) m.style.display='none'; } }, 3000);
      }
    });
  }
}

/* =========================================================
   EXPORT EXCEL (fichier .xls stylé, plusieurs feuilles)
   ========================================================= */
const XL = {
  ink:'#16234a', inkSoft:'#20305f', accent:'#f47c20', accentDark:'#d9660f', accentSoft:'#fdecdc',
  indigo:'#2f5fa8', indigoSoft:'#e5edf8', amber:'#2f5fa8', amberSoft:'#e5edf8',
  red:'#c93a30', redSoft:'#fbe1df', border:'#dfe3ee', muted:'#6b7280', zebra:'#f6f8fc',
};
function num(v){ return Math.round(Number(v)||0).toString(); }
const NUMFMT = `mso-number-format:'#,##0" ${'\u200b'}"';`; // placeholder unused
function tdNum(v, extra=''){
  return `<td style="mso-number-format:'#,##0';text-align:right;font-family:Calibri,sans-serif;font-size:12px;padding:8px 12px;border:1px solid ${XL.border};${extra}">${num(v)}</td>`;
}
function thCell(text, align){
  return `<th style="background:${XL.ink};color:#ffffff;padding:10px 12px;font-family:Calibri,sans-serif;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.4px;text-align:${align||'left'};border:1px solid ${XL.ink};">${text}</th>`;
}
function tdCell(text, extra=''){
  return `<td style="padding:8px 12px;font-family:Calibri,sans-serif;font-size:12px;border:1px solid ${XL.border};${extra}">${text}</td>`;
}
function bannerRow(title, cols){
  const themeLine = state.theme ? `<br><span style="font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:11.5px;color:#ffab5e;">« ${escapeHtml(state.theme)} »</span>` : '';
  return `<tr><td colspan="${cols}" style="background:${XL.ink};padding:0;border:none;">
    <table cellspacing="0" cellpadding="0" style="width:100%;"><tr>
      <td style="background:${XL.ink};padding:16px 14px 4px 14px;border:none;">
        <span style="font-family:Calibri,sans-serif;font-size:10px;letter-spacing:1.5px;color:${XL.accent};font-weight:bold;">CAMP JCF 2026</span><br>
        <span style="font-family:Georgia,serif;font-size:19px;color:#ffffff;font-weight:bold;">${title}</span>${themeLine}
      </td>
    </tr></table>
  </td></tr>`;
}
function subRow(text, cols){
  return `<tr><td colspan="${cols}" style="background:${XL.ink};padding:2px 14px 14px 14px;border:none;font-family:Calibri,sans-serif;font-size:10.5px;color:#b7bcdb;">${text}</td></tr>`;
}
function spacerRow(cols){ return `<tr><td colspan="${cols}" style="border:none;padding:6px;line-height:6px;">&nbsp;</td></tr>`; }
function sectionRow(text, cols){
  return `<tr><td colspan="${cols}" style="padding:14px 4px 8px 4px;font-family:Georgia,serif;font-size:14px;font-weight:bold;color:${XL.ink};border:none;border-bottom:2px solid ${XL.ink};">${text}</td></tr>`;
}
function totalRow(label, value, cols, color){
  const c = color || XL.ink;
  return `<tr>
    <td colspan="${cols-1}" style="padding:11px 12px;font-family:Calibri,sans-serif;font-weight:bold;font-size:12.5px;border-top:2px solid ${c};border-left:1px solid ${XL.border};border-bottom:1px solid ${XL.border};background:${XL.zebra};color:${c};">${label}</td>
    <td style="mso-number-format:'#,##0';text-align:right;font-family:Calibri,sans-serif;font-weight:bold;font-size:12.5px;padding:11px 12px;border-top:2px solid ${c};border-right:1px solid ${XL.border};border-bottom:1px solid ${XL.border};background:${XL.zebra};color:${c};">${num(value)}</td>
  </tr>`;
}

      ${totalRow('Total dépenses', tdep, 6, XL.red)}
    </table>`;

  // --- Feuille Participation ---
  const listP = [...state.participations].sort((a,b)=>a.date.localeCompare(b.date));
  const sheetParticipation = `
    <table cellspacing="0" cellpadding="0">
      ${bannerRow('Frais de Participation', 7)}
      ${subRow(listP.length + ' entrée(s) — devise : ' + escapeHtml(state.devise), 7)}
      ${spacerRow(7)}
      <tr>${thCell('Date')}${thCell('Nom')}${thCell('Prénom')}${thCell('Catégorie')}${thCell('Montant attendu','right')}${thCell('Montant reçu','right')}${thCell('Statut')}</tr>
      ${listP.map((p,i)=>{ const st = statutPaiement(p); const color = st.key==='partiel'?XL.red:(st.key==='excedent'?XL.amber:XL.accentDark); return `<tr style="background:${i%2? XL.zebra:'#ffffff'};">
        ${tdCell(fmtDate(p.date))}
        ${tdCell(escapeHtml(p.nom))}
        ${tdCell(escapeHtml(p.prenom))}
        ${tdCell(escapeHtml(catName(p.categorieId)))}
        ${tdNum(catFee(p.categorieId))}
        ${tdNum(p.montant)}
        ${tdCell(st.label,`color:${color};font-weight:bold;`)}
      </tr>`;}).join('') || `<tr>${tdCell('Aucune entrée.','font-style:italic;color:'+XL.muted+';')}</tr>`}
      ${totalRow('TOTAL PARTICIPATION', tp, 7, XL.accentDark)}
    </table>`;

  // --- Feuille Dons ---
  const listD = [...state.dons].sort((a,b)=>a.date.localeCompare(b.date));
  const sheetDons = `
    <table cellspacing="0" cellpadding="0">
      ${bannerRow('Dons', 4)}
      ${subRow(listD.length + ' don(s) — devise : ' + escapeHtml(state.devise), 4)}
      ${spacerRow(4)}
      <tr>${thCell('Date')}${thCell('Nom')}${thCell('Prénom')}${thCell('Montant','right')}</tr>
      ${listD.map((d,i)=>`<tr style="background:${i%2? XL.zebra:'#ffffff'};">
        ${tdCell(fmtDate(d.date))}${tdCell(escapeHtml(d.nom))}${tdCell(escapeHtml(d.prenom))}${tdNum(d.montant,`color:${XL.indigo};font-weight:bold;`)}
      </tr>`).join('') || `<tr>${tdCell('Aucun don.','font-style:italic;color:'+XL.muted+';')}</tr>`}
      ${totalRow('TOTAL DES DONS', tdns, 4, XL.indigo)}
    </table>`;

  // --- Feuille Dépenses (regroupée par catégorie, comme un vrai rapport) ---
  const depGroups = state.categoriesDepenses
    .map(cat => ({ cat, entries: state.depenses.filter(d=>d.categorie===cat).sort((a,b)=>a.date.localeCompare(b.date)) }))
    .filter(g => g.entries.length>0);
  const autresEntries = state.depenses.filter(d=>!state.categoriesDepenses.includes(d.categorie));
  if(autresEntries.length) depGroups.push({ cat:'Autres', entries:autresEntries });

  const sheetDepenses = `
    <table cellspacing="0" cellpadding="0">
      ${bannerRow('Dépenses', 4)}
      ${subRow(state.depenses.length + ' dépense(s) — devise : ' + escapeHtml(state.devise), 4)}
      ${spacerRow(4)}
      ${depGroups.map(g=>{
        const sousTotal = g.entries.reduce((s,d)=>s+Number(d.montant||0),0);
        return `
        <tr><td colspan="4" style="background:${XL.redSoft};padding:9px 12px;border:1px solid ${XL.border};font-family:Calibri,sans-serif;font-weight:bold;font-size:12.5px;color:${XL.ink};">${escapeHtml(g.cat)} <span style="font-weight:normal;color:${XL.muted};">(${g.entries.length})</span></td></tr>
        <tr>${thCell('Date')}${thCell('Description')}<th colspan="1" style="background:${XL.ink};border:1px solid ${XL.ink};"></th>${thCell('Montant','right')}</tr>
        ${g.entries.map((d,i)=>`<tr style="background:${i%2? XL.zebra:'#ffffff'};">
          ${tdCell(fmtDate(d.date))}
          <td colspan="2" style="padding:8px 12px;font-family:Calibri,sans-serif;font-size:12px;border:1px solid ${XL.border};">${escapeHtml(d.description)}</td>
          ${tdNum(d.montant,`color:${XL.red};`)}
        </tr>`).join('')}
        <tr>
          <td colspan="3" style="padding:8px 12px;font-family:Calibri,sans-serif;font-size:12px;font-weight:bold;border:1px solid ${XL.border};background:${XL.zebra};text-align:right;">Sous-total ${escapeHtml(g.cat)}</td>
          ${tdNum(sousTotal,`font-weight:bold;background:${XL.zebra};color:${XL.red};`)}
        </tr>
        ${spacerRow(4)}`;
      }).join('') || `<tr>${tdCell('Aucune dépense enregistrée.','font-style:italic;color:'+XL.muted+';')}</tr>`}
      ${totalRow('TOTAL GÉNÉRAL DES DÉPENSES', tdep, 4, XL.red)}
    </table>`;

  return `
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<!--[if gte mso 9]>
<xml>
<x:ExcelWorkbook>
<x:ExcelWorksheets>
<x:ExcelWorksheet><x:Name>Résumé</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>
<x:ExcelWorksheet><x:Name>Participation</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>
<x:ExcelWorksheet><x:Name>Dons</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>
<x:ExcelWorksheet><x:Name>Dépenses</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>
</x:ExcelWorksheets>
</x:ExcelWorkbook>
</xml>
<![endif]-->
</head>
<body>
${sheetResume}
${sheetParticipation}
${sheetDons}
${sheetDepenses}
</body>
</html>`;
}

function exportExcel(){
  const html = buildExportHTML();
  const blob = new Blob(['\ufeff'+html], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayISO();
  a.href = url;
  a.download = `Rapport_Financier_Camp_JCF_2026_${dateStr}.xls`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Rapport Excel généré ✓');
}
document.getElementById('btnExport').addEventListener('click', exportExcel);

   INIT
   ========================================================= */
loadState();

/* ---------- mode hors-ligne + mise à jour auto (service worker) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // Vérifie régulièrement une nouvelle version quand la connexion revient
      reg.update();
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        newWorker?.addEventListener('statechange', ()=>{
          if(newWorker.state==='activated'){ toast('Application mise à jour ✓'); }
        });
      });
    }).catch(()=>{ /* pas grave si indisponible, l'app fonctionne quand même */ });
  });
  window.addEventListener('online', ()=>{
    navigator.serviceWorker.getRegistration().then(reg=> reg && reg.update());
  });
}
</script>
